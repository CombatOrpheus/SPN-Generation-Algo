name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test (GNU Octave)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GNU Octave and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y octave liboctave-dev gnuplot make

      - name: Compile C++ Oct-files
        run: make

      - name: Run test suite
        run: octave --eval "tests/run_tests"

      - name: Run dataset generation test
        run: octave main.m --samples 10 --output test_ci.jsonl

      - name: Verify generated dataset
        run: |
          test -f test_ci.jsonl
          test -f test_ci.jsonl.html
          echo "CI pipeline verification completed successfully."
