services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_NAME: ${DEV_USER:-developer}
        USER_UID: ${DEV_UID:-1000}
        USER_GID: ${DEV_GID:-1000}
    image: spn-generation-algo-dev:latest
    working_dir: /workspace
    volumes:
      - .:/workspace
    stdin_open: true
    tty: true
    command: /bin/bash
